services:
  postgres:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      POSTGRES_PASSWORD: test-admin-password
      OPENVOX_DATABASE: puppetdb
      OPENVOX_USER: puppetdb
      OPENVOX_PASSWORD: test-app-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$OPENVOX_USER\" -d \"$$OPENVOX_DATABASE\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
